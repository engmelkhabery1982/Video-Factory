# ============================================================================
# FINAL PRODUCT ACCEPTANCE
#
# Acceptance, not development. This workflow proves the INTEGRATED Video
# Factory works as a real production product against the approved baseline
# (65ffb06f4f48f01906b7d89e27674c24a199cdf0 on arena/final-product-integration).
#
# It adds no product code. The acceptance driver is test infrastructure only:
#   scripts/final-product-acceptance.ts
#
# Four GATED jobs. A downstream job never runs when its required upstream gate
# failed, so a failure never forces expensive stages to repeat:
#
#   preflight          cheap: TTS, real Kokoro audio on the PRODUCT audio path,
#                      generation, one dialogue edit, reopen/restart persistence,
#                      stale-input detection, asset registration + real Long and
#                      Short bindings + absolute live-server media URLs + Phase
#                      6A mediaMap (NO video render)
#   short-smoke        real product preview job: native 1080x1920 Short render +
#                      real ffprobe verification + asset frame proof
#   final-production   real product export job: Long 1920x1080 + Short 1080x1920
#                      + Phase 6D package + asset frame proof
#   second-project     a SECOND fresh fictional project that consumes the
#                      persisted production history with NO render (17G)
#   evidence           lightweight evidence aggregation + hard stage assertion
#
# The driver is invoked DIRECTLY (`node --import tsx
# scripts/final-product-acceptance.ts <stage>`): the ROOT package.json is a
# forbidden file for this merge and stays byte-identical to the integration
# base, so acceptance adds no npm script.
#
# Trigger: a CONTROLLED ONE-TIME push on .github/final-acceptance-run-once plus
# workflow_dispatch. There is deliberately no general push trigger.
#
# Kokoro is provisioned ONLY via `npm run provision:tts` (no substitute TTS
# engine), cached on OS + lockfile + provisioner/model identity.
# ============================================================================

name: Final Product Acceptance

on:
  push:
    branches:
      - arena/final-product-acceptance
    paths:
      - '.github/final-acceptance-run-once'
  workflow_dispatch:

concurrency:
  group: final-product-acceptance-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '22'
  # Isolated, gitignored scratch. Never a real home directory.
  ACCEPTANCE_SCRATCH: '.stills/final-acceptance'
  # Retained for the TTS provisioner (same value the app uses).
  TTS_MODEL: 'onnx-community/Kokoro-82M-v1.0-ONNX'

jobs:
  # ------------------------------------------------------------------ preflight
  preflight:
    name: Preflight (cheap gates, no render)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout the acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache the provisioned Kokoro TTS model
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: ${{ runner.os }}-tts-${{ hashFiles('package-lock.json') }}-${{ hashFiles('tools/provision-tts.mjs') }}-${{ env.TTS_MODEL }}
          restore-keys: |
            ${{ runner.os }}-tts-

      # Report the ACTUAL cache result. Never assume a hit: a miss is a
      # legitimate outcome and `npm run provision:tts` then provisions it.
      - name: Record the actual Kokoro cache result
        run: |
          {
            echo "Kokoro TTS cache result for this job:"
            echo "  cache-hit        : ${{ steps.tts-cache.outputs.cache-hit }}"
            echo "  cache-matched-key: ${{ steps.tts-cache.outputs.cache-matched-key }}"
            if [ "${{ steps.tts-cache.outputs.cache-hit }}" = "true" ]; then
              echo "  outcome          : cache HIT - provision:tts is a no-op verification"
            else
              echo "  outcome          : cache MISS - provision:tts must provision the model"
            fi
          }
          {
            echo ""
            echo "Kokoro TTS cache: ${{ steps.tts-cache.outputs.cache-matched-key }} (cache-hit=${{ steps.tts-cache.outputs.cache-hit }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build core (tests run against packages/core/dist)
        run: npm run build:core

      - name: Provision the real production TTS model (Kokoro)
        run: npm run provision:tts

      - name: Verify the Kokoro model cache
        run: |
          set -euo pipefail
          test -f .tts-cache/.kokoro-model.ok
          test -s .tts-cache/models/onnx-community/Kokoro-82M-v1.0-ONNX/onnx/model_quantized.onnx
          echo "Kokoro model present:"
          du -sh .tts-cache/models/onnx-community/Kokoro-82M-v1.0-ONNX

      # 17J. Persist the provisioned model for the gated downstream jobs. The
      # model is ONLY ever a local cache: it is gitignored and never committed.
      - name: Save the provisioned Kokoro model cache (never committed to git)
        if: steps.tts-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .tts-cache
          key: ${{ steps.tts-cache.outputs.cache-primary-key }}

      # The acceptance script has its own tsconfig (17H). The ROOT package.json
      # is deliberately left untouched: the product guard in
      # tests/production-style-history.test.ts (gate 20) requires it unchanged.
      - name: Typecheck the acceptance driver
        run: npx tsc --noEmit -p scripts/tsconfig.json

      - name: Run the previously skipped real production-audio gates
        run: |
          set -uo pipefail
          mkdir -p .stills
          # These gates are guarded by `itProvisioned` and skip when the
          # gitignored .tts-cache model is absent. Here they MUST run, not
          # skip: the Kokoro production audio engine is the authority.
          npx vitest run tests/production-dialogue-audio.test.ts \
            > .stills/preflight-dialogue-audio.log 2>&1 || {
              tail -n 200 .stills/preflight-dialogue-audio.log; exit 1; }
          # Gate 14 is the product's own assertion that production proof never
          # touches the shared tests/fixtures/render/dialogue.wav.
          tail -n 30 .stills/preflight-dialogue-audio.log
          if grep -qE '[0-9]+ *\| *[0-9]+ *skipped' .stills/preflight-dialogue-audio.log; then
            echo "production-audio gates SKIPPED instead of running" >&2
            exit 1
          fi

      - name: Run the remaining skipped production-audio gate
        run: |
          set -uo pipefail
          mkdir -p .stills
          # Gate 9 of the product production integration suite (plan chain with
          # Kokoro as the engine authority). No full video render.
          npx vitest run tests/product-production-integration.test.ts \
            > .stills/preflight-production-integration.log 2>&1 || {
              tail -n 200 .stills/preflight-production-integration.log; exit 1; }
          tail -n 30 .stills/preflight-production-integration.log
          if grep -qE '[0-9]+ *\| *[0-9]+ *skipped' .stills/preflight-production-integration.log; then
            echo "production-audio gates SKIPPED instead of running" >&2
            exit 1
          fi

      - name: Preflight acceptance gates (API-level product E2E)
        run: |
          mkdir -p .stills
          node --import tsx scripts/final-product-acceptance.ts preflight 2>&1 | tee .stills/preflight.log
          test -f EVIDENCE/final-product/preflight-verification.json

      # The product audio root is `.production`, a hidden directory. The
      # downstream jobs must receive the REAL per-turn Kokoro WAVs, so the same
      # bytes are also copied to a non-hidden artifact path (a copy only - the
      # engine's own root is untouched and remains the authority).
      - name: Stage the real production audio for the artifact
        run: |
          set -euo pipefail
          rm -rf .stills/final-acceptance/audio-artifact
          mkdir -p .stills/final-acceptance/audio-artifact
          cp -r .production .stills/final-acceptance/audio-artifact/production
          echo "product audio root copy: $(find .stills/final-acceptance/audio-artifact -name '*.wav' | wc -l) WAV files"
          find .stills/final-acceptance/audio-artifact -name '*.wav' | head -5

      - name: Upload the preflight state for the gated downstream jobs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-preflight
          path: |
            .stills/final-acceptance/data
            .stills/final-acceptance/stage
            .stills/final-acceptance/audio-artifact
            .production
            EVIDENCE/final-product/preflight-verification.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Preflight"
            echo ""
            if [ -f EVIDENCE/final-product/preflight-verification.json ]; then
              echo "- status: passed"
              echo "- checks: $(node -e "console.log(require('./EVIDENCE/final-product/preflight-verification.json').checks.length)")"
              echo "- scenario: $(node -e "const s=require('./EVIDENCE/final-product/preflight-verification.json').scenario; console.log(s.longId + ' + ' + s.shortId)")"
            else
              echo "- status: FAILED (see log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- short-smoke
  short-smoke:
    name: Short smoke (native 1080x1920 render)
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 40
    steps:
      - name: Checkout the acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache the provisioned Kokoro TTS model
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: ${{ runner.os }}-tts-${{ hashFiles('package-lock.json') }}-${{ hashFiles('tools/provision-tts.mjs') }}-${{ env.TTS_MODEL }}
          restore-keys: |
            ${{ runner.os }}-tts-

      # Report the ACTUAL cache result. Never assume a hit: a miss is a
      # legitimate outcome and `npm run provision:tts` then provisions it.
      - name: Record the actual Kokoro cache result
        run: |
          {
            echo "Kokoro TTS cache result for this job:"
            echo "  cache-hit        : ${{ steps.tts-cache.outputs.cache-hit }}"
            echo "  cache-matched-key: ${{ steps.tts-cache.outputs.cache-matched-key }}"
            if [ "${{ steps.tts-cache.outputs.cache-hit }}" = "true" ]; then
              echo "  outcome          : cache HIT - provision:tts is a no-op verification"
            else
              echo "  outcome          : cache MISS - provision:tts must provision the model"
            fi
          }
          {
            echo ""
            echo "Kokoro TTS cache: ${{ steps.tts-cache.outputs.cache-matched-key }} (cache-hit=${{ steps.tts-cache.outputs.cache-hit }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Provision the renderer
        run: npm run provision

      - name: Provision the real production TTS model (Kokoro)
        run: npm run provision:tts

      # The acceptance script has its own tsconfig (17H). The ROOT package.json
      # is deliberately left untouched: the product guard in
      # tests/production-style-history.test.ts (gate 20) requires it unchanged.
      - name: Typecheck the acceptance driver
        run: npx tsc --noEmit -p scripts/tsconfig.json

      # Retry 5 is a COLD START: this restores the artifact THIS run's own
      # preflight job produced. Nothing is inherited from Retry 4 (run
      # 36888349699), whose preflight artifact is not retrievable here, and no
      # state or audio is ever fabricated.
      - name: Restore this run's preflight state
        uses: actions/download-artifact@v4
        with:
          name: final-acceptance-preflight
          path: .

      - name: Materialize the product audio root
        run: |
          set -euo pipefail
          test -f .stills/final-acceptance/stage/preflight.json
          test -d .stills/final-acceptance/data
          test -n "$(find .stills/final-acceptance/data -name '*.json' -print -quit)"
          if [ ! -d .production ] && [ -d .stills/final-acceptance/audio-artifact/production ]; then
            cp -r .stills/final-acceptance/audio-artifact/production .production
          fi
          test -d .production
          echo "production audio root: $(find .production -name '*.wav' | wc -l) WAV files"

      - name: Short smoke acceptance gates
        run: |
          mkdir -p .stills
          node --import tsx scripts/final-product-acceptance.ts short-smoke 2>&1 | tee .stills/short-smoke.log
          test -f EVIDENCE/final-product/short-smoke-media-verification.json

      - name: Upload the short smoke MP4 + evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-short-smoke
          path: |
            .stills/final-acceptance/output
            .stills/final-acceptance/stage
            EVIDENCE/final-product/short-smoke-media-verification.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Short smoke"
            echo ""
            if [ -f EVIDENCE/final-product/short-smoke-media-verification.json ]; then
              node -e "
                const m = require('./EVIDENCE/final-product/short-smoke-media-verification.json');
                console.log('- status: passed');
                console.log('- geometry: ' + m.width + 'x' + m.height);
                console.log('- video: ' + m.videoCodec + ' | audio: ' + m.audioCodec);
                console.log('- duration: ' + m.durationSeconds.toFixed(2) + 's');
              "
            else
              echo "- status: FAILED (see log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ----------------------------------------------------------- final-production
  final-production:
    name: Final production (Long + Short + package)
    runs-on: ubuntu-latest
    needs: [preflight, short-smoke]
    timeout-minutes: 75
    steps:
      - name: Checkout the acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache the provisioned Kokoro TTS model
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: ${{ runner.os }}-tts-${{ hashFiles('package-lock.json') }}-${{ hashFiles('tools/provision-tts.mjs') }}-${{ env.TTS_MODEL }}
          restore-keys: |
            ${{ runner.os }}-tts-

      # Report the ACTUAL cache result. Never assume a hit: a miss is a
      # legitimate outcome and `npm run provision:tts` then provisions it.
      - name: Record the actual Kokoro cache result
        run: |
          {
            echo "Kokoro TTS cache result for this job:"
            echo "  cache-hit        : ${{ steps.tts-cache.outputs.cache-hit }}"
            echo "  cache-matched-key: ${{ steps.tts-cache.outputs.cache-matched-key }}"
            if [ "${{ steps.tts-cache.outputs.cache-hit }}" = "true" ]; then
              echo "  outcome          : cache HIT - provision:tts is a no-op verification"
            else
              echo "  outcome          : cache MISS - provision:tts must provision the model"
            fi
          }
          {
            echo ""
            echo "Kokoro TTS cache: ${{ steps.tts-cache.outputs.cache-matched-key }} (cache-hit=${{ steps.tts-cache.outputs.cache-hit }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Provision the renderer
        run: npm run provision

      - name: Provision the real production TTS model (Kokoro)
        run: npm run provision:tts

      # The acceptance script has its own tsconfig (17H). The ROOT package.json
      # is deliberately left untouched: the product guard in
      # tests/production-style-history.test.ts (gate 20) requires it unchanged.
      - name: Typecheck the acceptance driver
        run: npx tsc --noEmit -p scripts/tsconfig.json

      # Retry 5 is a COLD START: this restores the artifact THIS run's own
      # preflight job produced. Nothing is inherited from Retry 4 (run
      # 36888349699), whose preflight artifact is not retrievable here, and no
      # state or audio is ever fabricated.
      - name: Restore this run's preflight state
        uses: actions/download-artifact@v4
        with:
          name: final-acceptance-preflight
          path: .

      - name: Materialize the product audio root
        run: |
          set -euo pipefail
          test -f .stills/final-acceptance/stage/preflight.json
          test -d .stills/final-acceptance/data
          test -n "$(find .stills/final-acceptance/data -name '*.json' -print -quit)"
          if [ ! -d .production ] && [ -d .stills/final-acceptance/audio-artifact/production ]; then
            cp -r .stills/final-acceptance/audio-artifact/production .production
          fi
          test -d .production
          echo "production audio root: $(find .production -name '*.wav' | wc -l) WAV files"

      - name: Final production acceptance gates
        run: |
          mkdir -p .stills
          node --import tsx scripts/final-product-acceptance.ts final-production 2>&1 | tee .stills/final-production.log
          test -f EVIDENCE/final-product/package-verification.json

      - name: Upload the rendered MP4s + Phase 6D package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-production
          path: |
            .stills/final-acceptance/output
            .stills/final-acceptance/stage
            EVIDENCE/final-product/long-media-verification.json
            EVIDENCE/final-product/short-media-verification.json
            EVIDENCE/final-product/frames
            EVIDENCE/final-product/package-verification.json
          retention-days: 14
          if-no-files-found: error

      # The production history written by the REAL final export is what the
      # second-project stage must consume.
      - name: Upload the post-export production state
        if: success()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-state
          path: |
            .stills/final-acceptance/data
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Final production"
            echo ""
            if [ -f EVIDENCE/final-product/package-verification.json ]; then
              node -e "
                const p = require('./EVIDENCE/final-product/package-verification.json');
                console.log('- status: passed');
                console.log('- package: ' + p.status + ' (readyForProductionDelivery: ' + p.readyForProductionDelivery + ')');
                console.log('- packaged targets: ' + p.packagedTargetIds.join(', '));
                console.log('- failed targets: ' + (p.failedTargetIds.length ? p.failedTargetIds.join(', ') : 'none'));
                console.log('- Long: ' + p.media.long.width + 'x' + p.media.long.height + ' ' + p.media.long.videoCodec + '/' + p.media.long.audioCodec);
                console.log('- Short: ' + p.media.short.width + 'x' + p.media.short.height + ' ' + p.media.short.videoCodec + '/' + p.media.short.audioCodec);
              "
            else
              echo "- status: FAILED (see log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------- second project
  second-project:
    name: Second fresh project (cross-project history reuse, no render)
    runs-on: ubuntu-latest
    needs: [final-production]
    timeout-minutes: 25
    steps:
      - name: Checkout the acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      # The acceptance script has its own tsconfig (17H). The ROOT package.json
      # is deliberately left untouched: the product guard in
      # tests/production-style-history.test.ts (gate 20) requires it unchanged.
      - name: Typecheck the acceptance driver
        run: npx tsc --noEmit -p scripts/tsconfig.json

      - name: Restore the post-export production state
        uses: actions/download-artifact@v4
        with:
          name: final-acceptance-state
          path: .

      - name: Second-project acceptance gates (no render)
        run: |
          mkdir -p .stills
          node --import tsx scripts/final-product-acceptance.ts second-project 2>&1 | tee .stills/second-project.log
          test -f EVIDENCE/final-product/second-project-verification.json

      - name: Upload the second-project evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-second-project
          path: |
            EVIDENCE/final-product/second-project-verification.json
          retention-days: 14
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Second project (cross-project history reuse, no render)"
            echo ""
            if [ -f EVIDENCE/final-product/second-project-verification.json ]; then
              node -e "
                const v = require('./EVIDENCE/final-product/second-project-verification.json');
                console.log('- status: passed');
                console.log('- second project: ' + v.secondProject.videoId);
                console.log('- history entries consumed: ' + v.productionHistory.consumedByProject2.productionEntryCount + ' (source: ' + v.productionHistory.consumedByProject2.source + ')');
                console.log('- renders: ' + v.secondProject.renders);
              "
            else
              echo "- status: FAILED (see log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------- evidence
  evidence:
    name: Evidence aggregation
    runs-on: ubuntu-latest
    needs: [preflight, short-smoke, final-production, second-project]
    timeout-minutes: 15
    # Write access is needed ONLY to commit the lightweight evidence back to the
    # acceptance branch. That commit touches no trigger path, so it cannot
    # re-trigger this workflow.
    permissions:
      contents: write
    steps:
      - name: Checkout the acceptance branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Cache the provisioned Kokoro TTS model
        id: tts-cache
        uses: actions/cache@v4
        with:
          path: .tts-cache
          key: ${{ runner.os }}-tts-${{ hashFiles('package-lock.json') }}-${{ hashFiles('tools/provision-tts.mjs') }}-${{ env.TTS_MODEL }}
          restore-keys: |
            ${{ runner.os }}-tts-

      # Report the ACTUAL cache result. Never assume a hit: a miss is a
      # legitimate outcome and `npm run provision:tts` then provisions it.
      - name: Record the actual Kokoro cache result
        run: |
          {
            echo "Kokoro TTS cache result for this job:"
            echo "  cache-hit        : ${{ steps.tts-cache.outputs.cache-hit }}"
            echo "  cache-matched-key: ${{ steps.tts-cache.outputs.cache-matched-key }}"
            if [ "${{ steps.tts-cache.outputs.cache-hit }}" = "true" ]; then
              echo "  outcome          : cache HIT - provision:tts is a no-op verification"
            else
              echo "  outcome          : cache MISS - provision:tts must provision the model"
            fi
          }
          {
            echo ""
            echo "Kokoro TTS cache: ${{ steps.tts-cache.outputs.cache-matched-key }} (cache-hit=${{ steps.tts-cache.outputs.cache-hit }})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install dependencies
        run: npm ci

      - name: Build core
        run: npm run build:core

      - name: Restore every gated stage
        uses: actions/download-artifact@v4
        with:
          pattern: final-acceptance-*
          merge-multiple: true
          path: .

      - name: Aggregate lightweight evidence
        run: |
          mkdir -p .stills EVIDENCE/final-product
          node --import tsx scripts/final-product-acceptance.ts evidence 2>&1 | tee .stills/evidence.log
          test -f EVIDENCE/final-product/acceptance-summary.json
          test -f EVIDENCE/final-product/acceptance-verification.json
          node -e "
            const v = require('./EVIDENCE/final-product/acceptance-verification.json');
            const missing = v.requiredStages.filter((s) => v.stages[s].status !== 'passed');
            if (missing.length) { console.error('acceptance stages missing/not passed: ' + missing.join(', ')); process.exit(1); }
            console.log('all required acceptance stages ran: ' + v.requiredStages.join(', '));
          "

      - name: Confirm only lightweight evidence is present (no media in git)
        run: |
          set -euo pipefail
          echo "--- evidence files ---"
          ls -la EVIDENCE/final-product
          echo "--- size of committed evidence ---"
          du -sh EVIDENCE/final-product
          echo "--- no MP4/WAV/ONNX committed ---"
          ! find EVIDENCE -type f \( -name '*.mp4' -o -name '*.wav' -o -name '*.onnx' \) | grep -q .

      - name: Commit the lightweight evidence
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add EVIDENCE/final-product
          if git diff --cached --quiet; then
            echo "no evidence changes to commit"
          else
            git commit -m "Acceptance evidence: Final Product Acceptance against 65ffb06f"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload the evidence bundle
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: final-acceptance-evidence
          path: |
            EVIDENCE/final-product
            .stills/final-acceptance/stage
          retention-days: 30
          if-no-files-found: error

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Final Product Acceptance"
            echo ""
            echo "**API-level product E2E; UI rendered but not click-automated**"
            echo ""
            if [ -f EVIDENCE/final-product/acceptance-summary.json ]; then
              node -e "
                const s = require('./EVIDENCE/final-product/acceptance-summary.json');
                console.log('- baseline: ' + s.baseline);
                console.log('- content: ' + s.content);
                console.log('- preflight: ' + s.stages.preflight);
                console.log('- short smoke: ' + s.stages.shortSmoke);
                console.log('- final production: ' + s.stages.finalProduction);
                console.log('- second project: ' + s.stages.secondProject);
                if (s.mediaUrlAuthority) console.log('- media URL authority: ' + s.mediaUrlAuthority.scheme);
                if (s.frameProofs) console.log('- frame proofs: ' + s.frameProofs.map((f) => f.stage + '=' + f.markerPixelsBestFrame + 'px').join(', '));
                if (s.package) console.log('- package: ' + s.package.status + ' / ready=' + s.package.readyForProductionDelivery);
                console.log('');
                if (s.asset && s.asset.mediaServing) {
                  console.log('Asset media serving (GET /media/asset/:id): HTTP ' + s.asset.mediaServing.status + ', ' + s.asset.mediaServing.servedBytes + ' bytes, bytes match the stored file: ' + s.asset.mediaServing.matchesStoredFile);
                }
                console.log('Asset path resolution: ' + (s.asset ? s.asset.pathResolution : 'n/a'));
                console.log('');
                console.log('Evidence files: ' + s.evidenceFiles.join(', '));
              "
            fi
          } >> "$GITHUB_STEP_SUMMARY"
